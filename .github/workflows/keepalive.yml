name: keepalive
# Free Supabase projects pause after ~7 days of zero activity. A daily-used board
# won't hit that, but this daily ping makes it a non-issue. Set repo Actions secrets
# SUPABASE_URL and SUPABASE_ANON_KEY (both are public-safe; secrets just keep YAML tidy).
on:
  schedule:
    - cron: "17 9 * * *"   # once a day, ~09:17 UTC
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the kv table
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/kv?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
